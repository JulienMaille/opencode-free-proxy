name: Sync with upstream

on:
  schedule:
    - cron: '0 2 * * *'   # каждый день в 2:00 UTC
  workflow_dispatch:      # позволяет запускать вручную

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/mmkeeper/opencode-free-proxy.git

      - name: Fetch upstream changes
        run: git fetch upstream

      - name: Merge upstream/main into your main
        run: |
          git checkout main
          git merge upstream/main --no-edit --allow-unrelated-histories || true
          
      - name: Push changes to your fork
        run: git push origin main
